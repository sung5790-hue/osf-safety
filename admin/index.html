<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 보안 : 이 페이지는 우리 파일과 구글 안전확인 화면만 열 수 있습니다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>일일 안전확인 현황</title>
<meta name="description" content="OSF Solution 일일 안전확인">
<meta name="theme-color" content="#050b1a" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="관리자 현황">
<!-- 아이폰 시계 줄을 화면 위에 겹치지 않고 따로 둡니다. 겹치면 아이폰이 그 아래를 일부러 흐리게 덮습니다 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" type="image/png" href="../favicon-admin.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-admin.png">
<link rel="preload" as="image" href="../logo-white.png">
<link rel="preload" as="font" type="font/woff2" href="../splash-ko.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../splash-en.woff2" crossorigin>
<style>
  html,body{margin:0;height:100%;background:#0a1326;overflow:hidden}
  /* 폰마다 맨 위 시계 줄, 맨 아래 버튼·제스처 줄이 화면 위에 겹칠 수 있습니다(아이폰, 최신 안드로이드).
     폰이 알려 주는 그 높이(safe-area)만큼 안전확인 화면을 비켜 놓습니다. 겹치지 않는 폰은 0 이라 그대로입니다.
     맨 위 시계 줄 자리는 앱 머리줄과 같은 남색으로 채웁니다 */
  /* --xtop : 아이폰이 시계 줄을 화면 위에 겹쳐 두는 옛 설정이면, 그 아래 한 뼘을 흐리게 덮습니다. 그만큼 더 내립니다(아래 스크립트) */
  :root{--xtop:0px}
  #topbar{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + var(--xtop));background:#0c1a3d;z-index:1}
  /* 안전확인 화면을 꽉 채워 띄웁니다 */
  #app{position:fixed;border:0;background:#0a1326;
    top:calc(env(safe-area-inset-top,0px) + var(--xtop));left:env(safe-area-inset-left,0px);
    width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
    height:calc(100% - env(safe-area-inset-top,0px) - var(--xtop) - env(safe-area-inset-bottom,0px))}
  /* 로고 화면 글씨 : 로고처럼 굵은 글꼴 (필요한 글자만 담은 작은 파일, 이 저장소 안에 있음) */
  @font-face{font-family:'OSF KO';src:url(../splash-ko.woff2) format('woff2');font-weight:800;font-display:block}
  @font-face{font-family:'OSF EN';src:url(../splash-en.woff2) format('woff2');font-weight:800;font-display:block}
  /* 관리자 앱 처음 화면 (약 3.6초) : 작업자 앱(파란 빛줄기)과 다르게 금색 방패
     0.1초  검은 바탕에 금빛이 은은하게 번지고, 금색 방패 테두리가 그려짐 (안쪽 가는 테두리가 뒤따름)
     1.0초  방패가 한 번 밝게 번쩍이며 안이 금빛으로 차고, 로고가 드러남
     1.8초  로고 위로 금빛이 한 번 지나감
     2.0초  구분선, 2.2초 「일일 안전확인」, 2.4초 금색 「관리자」, 2.6초 SAFETY FIRST */
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:#0a0805;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    transition:background-color 1s ease;-webkit-user-select:none;user-select:none}
  #splash.out{background-color:rgba(10,8,5,0);pointer-events:none}
  #splash .glow{position:absolute;inset:0;opacity:0;animation:fade 1.6s ease-out .05s forwards;
    background:radial-gradient(ellipse 90% 65% at 50% 44%,rgba(201,150,42,.34) 0%,rgba(150,104,24,.2) 30%,rgba(70,48,12,.1) 55%,rgba(10,8,5,0) 85%)}
  #splash .grid{position:absolute;inset:-2px;opacity:0;animation:grid 2.4s ease-out .1s forwards;
    background-image:linear-gradient(rgba(240,200,120,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(240,200,120,.05) 1px,transparent 1px);
    background-size:28px 28px;background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 44%,rgba(0,0,0,.9) 0%,rgba(0,0,0,.4) 35%,transparent 80%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% 44%,rgba(0,0,0,.9) 0%,rgba(0,0,0,.4) 35%,transparent 80%)}
  /* 금색 원과 다이얼 눈금 (로고 자리 둘레) */
  #splash .lw{position:relative;display:flex;align-items:center;justify-content:center}
  #splash .seal{position:absolute;left:50%;top:50%;width:min(64vw,250px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
  #splash .seal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #splash .seal .ring{fill:none;stroke:url(#gd);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;
    filter:drop-shadow(0 0 4px rgba(245,190,80,.7));animation:ring 1s cubic-bezier(.6,0,.2,1) .1s forwards,ringdim 1.2s ease-out 1.3s forwards}
  #splash .flash{position:absolute;left:50%;top:50%;width:min(64vw,250px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.9);border-radius:50%;opacity:0;
    background:radial-gradient(circle,rgba(255,224,150,.35) 0%,rgba(245,190,80,.12) 40%,transparent 70%);animation:flash .8s ease-out 1s forwards}
  #splash .logo{position:relative;width:min(40vw,160px);aspect-ratio:600/356;opacity:0;
    animation:logo 1.1s cubic-bezier(.2,.8,.2,1) .95s forwards}
  #splash .logo img{display:block;width:100%;height:100%;-webkit-user-drag:none}
  #splash .logo::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,214,120,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;
    -webkit-mask:url(../logo-white.png) center/contain no-repeat;mask:url(../logo-white.png) center/contain no-repeat;
    animation:sheen 1.1s ease-in-out 1.8s forwards}
  #splash .line{position:relative;margin-top:96px;width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(243,201,105,.9),transparent);animation:line .9s ease-out 2s forwards}
  #splash .t{position:relative;margin-top:16px;color:#fff7e6;font-family:'OSF KO','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:23px;font-weight:800;letter-spacing:8px;padding-left:8px;opacity:0;animation:tx .8s ease-out 2.2s forwards}
  #splash .adm{position:relative;margin-top:14px;padding:6px 18px 6px 22px;border:1px solid rgba(243,201,105,.8);border-radius:99px;
    color:#ffe2a0;font-family:'OSF KO','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15.5px;font-weight:800;letter-spacing:4px;line-height:1.3;
    text-shadow:0 1px 2px rgba(0,0,0,.55);background:linear-gradient(180deg,rgba(243,201,105,.2),rgba(243,201,105,.08));opacity:0;animation:tx .8s ease-out 2.4s forwards}
  #splash .s{position:relative;margin-top:12px;color:#c9a35a;font-family:'OSF EN',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:5px;padding-left:5px;opacity:0;animation:tx .8s ease-out 2.6s forwards}
  #splash .b{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,240,210,.75);font-family:'OSF EN',sans-serif;font-size:10.5px;letter-spacing:5px;padding-left:5px;font-weight:800;opacity:0;animation:tx .7s ease-out .4s forwards}
  #splash .b .pg{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #splash .b .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8860b,#f3c969);border-radius:2px;animation:pg 3.3s cubic-bezier(.4,0,.2,1) .3s forwards}
  #splash .bar{position:relative;margin-top:26px;width:110px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:tx .5s ease-out 4.2s forwards}
  #splash .bar i{position:absolute;top:0;bottom:0;width:40%;background:#f3c969;border-radius:2px;animation:load 1.1s ease-in-out infinite}
  #splash .seal.sv{width:min(62vw,240px);aspect-ratio:100/110}
  #splash .seal .ring2{fill:none;stroke:rgba(243,201,105,.55);stroke-width:.8;stroke-dasharray:1000;stroke-dashoffset:1000;animation:ring 1s cubic-bezier(.6,0,.2,1) .35s forwards,ringdim 1.2s ease-out 1.4s forwards}
  #splash .seal .fill{fill:url(#gd);opacity:0;animation:sfill .9s ease-out .95s forwards}
  @keyframes sfill{0%{opacity:0}40%{opacity:.22}100%{opacity:.08}}
  #splash .logo{width:min(36vw,150px)}
  #splash .line{margin-top:110px}
  @keyframes ring{to{stroke-dashoffset:0}}
  @keyframes ringdim{to{opacity:.35}}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
  @keyframes fade{to{opacity:1}}
  @keyframes grid{to{opacity:1}}
  @keyframes scan{0%{width:0;opacity:1}70%{width:92vw;opacity:1}100%{width:100vw;opacity:0}}
  @keyframes logo{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;clip-path:inset(0 0 0 0);filter:none}}
  @keyframes sheen{to{background-position:-60% 0}}
  @keyframes line{to{width:170px}}
  @keyframes tx{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pg{to{width:100%}}
  @keyframes load{0%{left:-40%}100%{left:100%}}
  @media(prefers-reduced-motion:reduce){
    #splash .scan,#splash .beams,#splash .logo::after,#splash .flash{display:none}
    #splash .seal .ring{animation:none!important;stroke-dashoffset:0;opacity:.35}
    #splash .adm{animation-duration:.01s!important;animation-delay:0s!important}
    #splash .glow,#splash .grid,#splash .logo,#splash .line,#splash .t,#splash .s,#splash .b,#splash .b .pg i{animation-duration:.01s!important;animation-delay:0s!important}
    #splash .line{width:170px}
  }
  #fail{display:none;position:relative;margin-top:22px;text-align:center;color:#fff;font-size:15px;line-height:1.6}
  #fail button,#fail a{display:inline-block;margin:12px 4px 0;padding:11px 18px;border-radius:12px;border:0;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}
  #fail button{background:#f3c969;color:#2a1d05}#fail a{background:rgba(255,255,255,.14);color:#fff}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="glow"></div><div class="grid"></div>
  <div class="lw"><div class="flash"></div><div class="seal sv"><svg viewBox="0 0 100 110"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset=".5" stop-color="#f3c969"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs><path class="fill" d="M50 5 L88 18 V52 C88 79 71 96 50 104 C29 96 12 79 12 52 V18 Z"/><path class="ring" d="M50 5 L88 18 V52 C88 79 71 96 50 104 C29 96 12 79 12 52 V18 Z" pathLength="1000"/><path class="ring2" d="M50 11 L82 22 V52 C82 74 68 89 50 96 C32 89 18 74 18 52 V22 Z" pathLength="1000"/></svg></div><div class="logo"><img src="../logo-white.png" alt="OSF" width="600" height="356" decoding="sync" draggable="false"></div></div>
  <div class="line"></div>
  <div class="t">일일 안전확인</div>
  <div class="adm">관리자</div>
  <div class="s">SAFETY FIRST</div>
  <div class="bar" id="bar"><i></i></div>
  <div id="fail">연결이 늦어지고 있습니다.<br>
    <button type="button" id="retry">다시 시도</button><a id="direct" target="_top" rel="noopener">브라우저로 열기</a></div>
  <div class="b"><span class="pg"><i></i></span>OSF SOLUTION<small style="display:block;margin-top:-4px;font-size:9px;letter-spacing:2px;opacity:.55">v18</small></div>
</div>
<div id="topbar"></div>
<iframe id="app" title="일일 안전확인" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<script>
(function(){
  // 안전확인 웹 앱 주소. 배포 주소가 바뀌면 이 한 줄만 고치면 됩니다.
  var APP = 'https://script.google.com/macros/s/AKfycbxgioTbd5RmjUKZzXljEFD5HaTg-gu353soMZmAjMdoZnApTHG8jl5XtZ_gG5W5tJ4/exec';
  // 주소 끝에 ?admin=1 을 붙이면 관리자 현황 화면을 엽니다. 비밀번호는 화면에서 따로 받습니다.
  // admin=1 말고 다른 것은 넘기지 않습니다.
  // 관리자 전용 주소 : 늘 관리자 현황 화면. 비밀번호는 화면에서 따로 받습니다.
  var ADMIN = true;
  if (ADMIN) { APP += '?admin=1'; document.title = '일일 안전확인 현황'; }
  // 이 기기 표시 (관리자 기기 승인용). 안쪽 화면 저장공간이 지워져도 같은 기기로 알아보게 바깥에서 기억해 넘깁니다.
  // 아이폰, 삼성폰 홈 화면 앱은 안쪽 저장공간을 자주 지워서, 이게 없으면 열 때마다 다시 허용을 받아야 합니다.
  var ADEV = '';
  try {
    var okd = function (v) { return /^[A-Za-z0-9]{8,40}$/.test(String(v || '')); };
    var ck = (document.cookie.match(/(?:^|;\s*)osf_adev=([A-Za-z0-9]+)/) || [])[1];
    ADEV = localStorage.getItem('osf_adev');
    if (!okd(ADEV)) ADEV = okd(ck) ? ck : 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    localStorage.setItem('osf_adev', ADEV);
    document.cookie = 'osf_adev=' + ADEV + ';max-age=34560000;path=/;samesite=lax;secure';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) {}
  if (ADEV) APP += '&adev=' + ADEV;
  var SHOW = 3600;                      // 로고가 사라지기 시작하는 때 (1000 = 1초)
  var f = document.getElementById('app'), s = document.getElementById('splash');
  // (흐림은 안전확인 화면 안쪽에서 처리합니다. Index.html 의 아이폰 남색 띠)
  var t0 = Date.now(), done = false, slow;
  // 다른 사이트가 이 페이지를 몰래 감싸 띄우지 못하게 합니다
  if (window.top !== window.self) { try { window.top.location = location.href; } catch (e) {} }
  // 빛줄기 : 사방에서 가운데로 모입니다
  (function(){ var B=document.getElementById('beams'), n=18; if(!B) return;
    for (var i=0;i<n;i++){ var e=document.createElement('i'); e.style.setProperty('--r',(i*360/n+(i%2?7:0))+'deg');
      e.style.animationDelay=(0.05+Math.random()*0.45).toFixed(2)+'s'; B.appendChild(e); } })();
  // 관리자 주소면 로고 아래 글을 「관리자 현황」으로
  // 관리자 앱은 「일일 안전확인」 아래 금색 「관리자」 표시로 구분합니다
  document.getElementById('direct').href = APP;
  function hide(){
    if (done) return; done = true; clearTimeout(slow);
    // 화면이 먼저 준비돼도 로고 연출은 끝까지 보여 줍니다
    setTimeout(land, Math.max(0, SHOW - (Date.now() - t0)));
  }
  // 끝 : 스르륵 걷히기 (약 1.8초)
  //   0.0초  글자 줄(구분선, 일일 안전확인, 관리자, SAFETY FIRST, 아래 OSF SOLUTION)이 살짝 위로 뜨며 먼저 옅어짐
  //   0.0초  방패와 로고는 제자리에서 아주 조금 커지며 천천히 옅어짐 (끝으로 갈수록 더 천천히)
  //   0.6초  뒤 금빛과 격자, 검은 바탕이 걷히며 안쪽 로그인 화면이 드러남
  //   모든 것이 다 옅어진 뒤에 화면에서 뺍니다. 중간에 뚝 꺼지는 것이 없게
  function land(){
    var T = 1800, RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (RM) T = 600;
    var all = s.querySelectorAll('.glow,.grid,.flash,.logo,.logo img,.line,.t,.adm,.s,.b,.bar');
    [].forEach.call(all, function(e){ var o = getComputedStyle(e).opacity; e.style.animation = 'none'; e.style.opacity = o; });
    // 방패 테두리 선은 손대지 않습니다 (멈추면 선이 다시 지워져 보임). 감싼 .lw 와 함께 옅어집니다
    void s.offsetWidth;                      // 지금 모습에서 이어서 움직이도록
    var ease = 'cubic-bezier(.4,0,.2,1)';
    [].forEach.call(s.querySelectorAll('.line,.t,.adm,.s,.b,.bar'), function(e, i){
      var d = Math.round(i * 40);           // 위에서부터 차례로 아주 조금씩 늦게
      e.style.transition = 'opacity ' + Math.round(T * .42) + 'ms ' + ease + ' ' + d + 'ms,transform ' + Math.round(T * .42) + 'ms ' + ease + ' ' + d + 'ms';
      e.style.opacity = 0; e.style.transform = 'translateY(-6px)'; });
    var LW = s.querySelector('.lw');
    LW.style.opacity = 0; LW.style.transform = 'scale(1.035)';
    if (LW.animate && !RM) {
      // 눈은 옅은 빛의 변화에 예민해서, 진하기를 똑같은 빠르기로 빼면 끝에 「팍」 꺼져 보입니다.
      // 진하기를 (1-t)^2.4 로 빼서 눈에 고르게 줄어들고, 끝으로 갈수록 더 천천히 사라지게 합니다.
      var K = [];
      for (var i = 0; i <= 24; i++) { var t = i / 24; K.push({opacity: Math.pow(1 - t, 2.4), transform: 'scale(' + (1 + .035 * (1 - Math.pow(1 - t, 2))).toFixed(4) + ')', offset: t}); }
      LW.animate(K, {duration: T, easing: 'linear'});
    } else {
      LW.style.transition = 'opacity ' + T + 'ms ease,transform ' + T + 'ms ease';
    }
    [].forEach.call(s.querySelectorAll('.glow,.grid'), function(e){ e.style.transition = 'opacity ' + Math.round(T * .8) + 'ms ease-in-out ' + Math.round(T * .2) + 'ms'; e.style.opacity = 0; });
    // 바탕은 방패가 절반쯤 옅어진 뒤부터 천천히 걷힙니다
    s.style.transition = 'background-color ' + Math.round(T * .66) + 'ms ease-in-out ' + Math.round(T * .34) + 'ms';
    s.className = 'out';
    document.getElementById('tc').content = '#0c1a3d';   // 위쪽 상태바를 앱 머리 색으로
    setTimeout(function(){ s.style.display = 'none'; }, T + 200);
  }
  // 안쪽 관리자 화면이 「준비됨」 을 알려 오면 (잠금 상자까지 다 그려진 뒤) 걷기 시작합니다.
  // 예전 판 관리자 화면처럼 신호가 없으면, 화면을 다 받은 뒤 2.5초를 기다렸다가 걷습니다.
  var readyT = null;
  window.addEventListener('message', function(e){
    var o = String(e.origin || '');
    if (e.data === 'osf-admin-ready' && (/\.googleusercontent\.com$/.test(o) || o === 'https://script.google.com')) { clearTimeout(readyT); hide(); }
  });
  function go(){
    done = false; s.className = ''; s.style.display = '';
    document.getElementById('fail').style.display = 'none'; document.getElementById('bar').style.display = '';
    f.onload = function(){ clearTimeout(readyT); readyT = setTimeout(hide, 2500); }; f.src = APP + (APP.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
    clearTimeout(slow);
    slow = setTimeout(function(){              // 15초가 넘으면 다시 시도 버튼
      if (done) return;
      document.getElementById('bar').style.display = 'none';
      document.getElementById('fail').style.display = 'block';
    }, 15000);
  }
  document.getElementById('retry').onclick = function(){ t0 = Date.now() - SHOW; go(); };
  go();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function(){});
})();
</script>
</body>
</html>
