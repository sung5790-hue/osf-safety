<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 보안 : 이 페이지는 우리 파일과 구글 안전확인 화면만 열 수 있습니다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>일일 안전확인</title>
<meta name="description" content="OSF Solution 일일 안전확인">
<meta name="theme-color" content="#050b1a" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안전확인">
<!-- 아이폰 시계 줄을 화면 위에 겹치지 않고 따로 둡니다. 겹치면 아이폰이 그 아래를 일부러 흐리게 덮습니다 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // 예전 관리자 주소(?admin=1)로 들어오면 관리자 전용 주소(admin/)로 보냅니다
  if (/(?:^|[?&])admin=1(?:&|$)/.test(location.search)) location.replace('admin/');
</script>
<link rel="preload" as="font" type="font/woff2" href="splash-ko.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="splash-en.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="splash-ost.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="splash-tl.woff2" crossorigin>
<style>
  html,body{margin:0;height:100%;background:#0a1326;overflow:hidden}
  /* 폰마다 맨 위 시계 줄, 맨 아래 버튼·제스처 줄이 화면 위에 겹칠 수 있습니다(아이폰, 최신 안드로이드).
     폰이 알려 주는 그 높이(safe-area)만큼 안전확인 화면을 비켜 놓습니다. 겹치지 않는 폰은 0 이라 그대로입니다.
     맨 위 시계 줄 자리는 앱 머리줄과 같은 남색으로 채웁니다 */
  /* --xtop : 아이폰이 시계 줄을 화면 위에 겹쳐 두는 옛 설정이면, 그 아래 한 뼘을 흐리게 덮습니다. 그만큼 더 내립니다(아래 스크립트) */
  :root{--xtop:0px}
  #topbar{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + var(--xtop));background:#0c1a3d;z-index:1}
  /* 안전확인 화면을 꽉 채워 띄웁니다 */
  #app{position:fixed;border:0;background:#0a1326;
    top:calc(env(safe-area-inset-top,0px) + var(--xtop));left:env(safe-area-inset-left,0px);
    width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
    height:calc(100% - env(safe-area-inset-top,0px) - var(--xtop) - env(safe-area-inset-bottom,0px))}
  /* 로고 화면 글씨 : 로고처럼 굵은 글꼴 (필요한 글자만 담은 작은 파일, 이 저장소 안에 있음) */
  @font-face{font-family:'OSF KO';src:url(splash-ko.woff2) format('woff2');font-weight:800;font-display:block}
  @font-face{font-family:'OSF EN';src:url(splash-en.woff2) format('woff2');font-weight:800;font-display:block}
  /* 처음 로고 화면 (약 3.6초)
     0.1초  어두운 남색 바탕에 가는 격자가 은은하게 떠오르고, 빛줄기가 사방에서 가운데로 모임
     0.6초  가운데 가로 빛줄이 양옆으로 그어지고, 로고가 왼쪽에서 오른쪽으로 드러나며 또렷해짐
     1.7초  로고 위로 금속 같은 빛이 한 번 지나감
     2.0초  가는 구분선, 2.2초 「일일 안전확인」, 2.5초 SAFETY FIRST
     아래쪽 가는 줄이 3.6초 동안 차오름. 3.6초 뒤 로고가 천천히 옅어지며 바탕이 걷힘 */
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:#040915;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    transition:background-color 1s ease;-webkit-user-select:none;user-select:none}
  #splash.out{background-color:rgba(4,9,21,0);pointer-events:none}
  /* 바탕 : 가운데만 살짝 밝은 남색 + 가는 격자 (가장자리로 갈수록 사라짐) */
  #splash .glow{position:absolute;inset:0;opacity:0;animation:fade 1.6s ease-out .05s forwards;
    background:radial-gradient(ellipse 95% 70% at 50% var(--cy,44%),rgba(34,78,156,.5) 0%,rgba(22,52,112,.34) 28%,rgba(12,28,64,.18) 52%,rgba(6,14,32,.06) 72%,rgba(4,9,21,0) 92%)}
  #splash .grid{position:absolute;inset:-2px;opacity:0;animation:grid 2.4s ease-out .1s forwards;
    background-image:linear-gradient(rgba(140,180,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,180,255,.07) 1px,transparent 1px);
    background-size:28px 28px;background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% var(--cy,44%),rgba(0,0,0,.9) 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,.15) 60%,transparent 85%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% var(--cy,44%),rgba(0,0,0,.9) 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,.15) 60%,transparent 85%)}
  /* 빛줄기 : 사방에서 로고 자리로 모임 */
  #splash .beams{position:absolute;left:50%;top:var(--cy,44%);width:0;height:0}
  #splash .beams i{position:absolute;left:0;top:-1.25px;height:2.5px;width:52vmax;transform-origin:0 50%;opacity:0;
    background:linear-gradient(90deg,rgba(120,180,255,0),rgba(150,200,255,.85) 65%,#fff);filter:blur(.5px) drop-shadow(0 0 5px rgba(120,180,255,.85));
    animation:beam 1.05s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes beam{0%{opacity:0;transform:rotate(var(--r)) translateX(48vmax) scaleX(.2)}35%{opacity:1}100%{opacity:0;transform:rotate(var(--r)) translateX(0) scaleX(1)}}
  /* 가운데 가로 빛줄 : 양옆으로 그어졌다가 옅어짐 */
  #splash .scan{position:absolute;left:50%;top:var(--cy,44%);width:0;height:1px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(127,179,255,.9) 30%,#fff 50%,rgba(127,179,255,.9) 70%,transparent);
    box-shadow:0 0 12px rgba(127,179,255,.8);animation:scan .75s cubic-bezier(.6,0,.2,1) .2s forwards}
  #splash .logo{position:relative;width:min(50vw,210px);aspect-ratio:600/356;opacity:0;
    animation:logo 1.1s cubic-bezier(.2,.8,.2,1) .85s forwards}
  #splash .logo img{display:block;width:100%;height:100%;-webkit-user-drag:none}
  /* 로고 위를 지나가는 빛 (로고 모양 안에서만) */
  #splash .logo::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;
    -webkit-mask:url(logo-white.png) center/contain no-repeat;mask:url(logo-white.png) center/contain no-repeat;
    animation:sheen 1.1s ease-in-out 1.9s forwards}
  #splash .line{position:relative;margin-top:18px;width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(160,200,255,.85),transparent);animation:line .9s ease-out 2s forwards}
  #splash .t{position:relative;margin-top:16px;color:#fff;font-family:'OSF KO','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:23px;font-weight:800;letter-spacing:8px;padding-left:8px;opacity:0;animation:tx .8s ease-out 2.2s forwards}
  #splash .s{position:relative;margin-top:10px;color:#8fb6f0;font-family:'OSF EN',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:5px;padding-left:5px;opacity:0;animation:tx .8s ease-out 2.5s forwards}
  #splash .b{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.78);font-family:'OSF EN',sans-serif;font-size:10.5px;letter-spacing:5px;padding-left:5px;font-weight:800;opacity:0;animation:tx .7s ease-out .4s forwards}
  #splash .b .pg{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #splash .b .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#9cc7ff);border-radius:2px;animation:pg 3.3s cubic-bezier(.4,0,.2,1) .3s forwards}
  /* 불러오기 줄 : 4초가 지나도 화면이 준비 안 됐을 때만 보입니다 */
  #splash .bar{position:relative;margin-top:26px;width:110px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:tx .5s ease-out 4.2s forwards}
  #splash .bar i{position:absolute;top:0;bottom:0;width:40%;background:#7fb3ff;border-radius:2px;animation:load 1.1s ease-in-out infinite}
  /* 같은 날 다시 열 때 : 짧은 화면 (약 1.2초). 빛줄기와 가로 빛줄 없이 로고와 글만 빠르게 */
  #splash.quick .beams,#splash.quick .scan{display:none}
  #splash.quick .glow,#splash.quick .grid{animation-duration:.45s;animation-delay:0s}
  #splash.quick .logo{animation:qlogo .55s cubic-bezier(.2,.8,.2,1) .05s forwards}
  #splash.quick .logo::after{animation:sheen .8s ease-in-out .35s forwards}
  #splash.quick .line{animation-duration:.5s;animation-delay:.3s}
  #splash.quick .t{animation-duration:.45s;animation-delay:.35s}
  #splash.quick .s{animation-duration:.45s;animation-delay:.45s}
  #splash.quick .b{animation-delay:0s}
  #splash.quick .b .pg i{animation-duration:1.1s;animation-delay:0s}
  @keyframes qlogo{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes grid{to{opacity:1}}
  @keyframes scan{0%{width:0;opacity:1}70%{width:92vw;opacity:1}100%{width:100vw;opacity:0}}
  @keyframes logo{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;clip-path:inset(0 0 0 0);filter:none}}
  @keyframes sheen{to{background-position:-60% 0}}
  @keyframes line{to{width:170px}}
  @keyframes tx{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pg{to{width:100%}}
  @keyframes load{0%{left:-40%}100%{left:100%}}
  @media(prefers-reduced-motion:reduce){
    #splash .scan,#splash .beams,#splash .logo::after{display:none}
    #splash .glow,#splash .grid,#splash .logo,#splash .line,#splash .t,#splash .s,#splash .b,#splash .b .pg i{animation-duration:.01s!important;animation-delay:0s!important}
    #splash .line{width:170px}
  }
  #fail{display:none;position:relative;margin-top:22px;text-align:center;color:#fff;font-size:15px;line-height:1.6}
  #fail button,#fail a{display:inline-block;margin:12px 4px 0;padding:11px 18px;border-radius:12px;border:0;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}
  #fail button{background:#fff;color:#152b5c}#fail a{background:rgba(255,255,255,.14);color:#fff}

  /* ── v5 더한 것 ──
     로고 아래 「OUR SH#ffffffNG FUTURE」 (OSF 뜻) : 첫 글자 O, S, F 가 먼저 굵게 빛나며 나타나고 (1.5초~), 나머지 글자가 첫 글자 뒤로 풀려 나옴 (1.9초~)
     로고 위로 빛이 지나갈 때 O, S, F 가 그 빛과 같은 때 차례로 반짝임 */
  @font-face{font-family:'OSF OST';src:url(splash-ost.woff2) format('woff2');font-weight:500;font-display:block}
  #splash .ost{position:relative;margin-top:18px;display:flex;gap:11px;font-size:11.5px;line-height:1;letter-spacing:4px;padding-left:4px;white-space:nowrap}
  #splash .ost .w{display:inline-flex;align-items:baseline}
  #splash .ost b{display:inline-block;font-size:19px;font-family:'OSF EN',sans-serif;font-weight:800;color:#ffffff;text-shadow:0 0 10px rgba(127,179,255,.95);opacity:0;animation:ini .8s cubic-bezier(.16,1,.3,1) forwards}
  #splash .ost i{display:inline-block;font-style:normal;font-family:'OSF OST','OSF EN',sans-serif;font-weight:500;color:#8fb6f0;opacity:0;animation:unf .7s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes ini{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:none}}
  @keyframes unf{0%{opacity:0;transform:translateX(-7px)}100%{opacity:.9;transform:none}}
  /* 제목 문장 「Your check, our future」 : 아래 SAFETY FIRST 와 똑같은 글꼴 (Montserrat ExtraBold), Your check, 는 또렷하게 our future 는 옅게 (위 OUR SH#ffffffNG FUTURE 와 강조가 겹치지 않게) */
  @font-face{font-family:'OSF TL';src:url(splash-tl.woff2) format('woff2');font-weight:800;font-display:block}
  #splash .t{font-family:'OSF TL','OSF EN',sans-serif;font-size:18px;font-weight:800;letter-spacing:1px;padding-left:1px;white-space:nowrap}
  #splash .t .a{opacity:.55}#splash .t b{font-weight:800}
  
  /* 로고가 드러나는 끝을 따라가는 빛 선 */
  #splash .edge{position:absolute;width:2px;margin-left:-1px;border-radius:2px;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,transparent,#fff 28%,#fff 72%,transparent);box-shadow:0 0 10px 2px rgba(127,179,255,.85)}
  /* 멀리 있는 작은 빛 */
  #splash .amb{position:absolute;inset:0;pointer-events:none}
  #splash .amb i{position:absolute;border-radius:50%;background:#a9ccff;opacity:0;animation:tw var(--d) ease-in-out var(--dl) infinite}
  @keyframes tw{0%,100%{opacity:0}50%{opacity:var(--o)}}
  /* 로고 위 빛이 다 지나갈 때 로고 고리 끝에서 한 번 맺히는 가는 빛 (가로로 긴 빛 + 작은 별빛) */
  #splash .glint{position:absolute;width:0;height:0;pointer-events:none;opacity:0}
  #splash .glint::before{content:'';position:absolute;left:-70px;top:-1px;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(127,179,255,.95) 35%,#fff 50%,rgba(127,179,255,.95) 65%,transparent)}
  #splash .glint::after{content:'';position:absolute;left:-1px;top:-13px;width:2px;height:26px;border-radius:2px;background:linear-gradient(180deg,transparent,#fff 50%,transparent)}
  #splash .glint i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(127,179,255,.95)}
  
  /* 같은 날 다시 열 때 (약 1.2초) 도 처음 장면을 짧게 : 빛줄기가 모이고 → 가로 빛줄 → 로고가 왼쪽부터 드러남 */
  #splash.quick .beams,#splash.quick .scan{display:block}
  #splash.quick .beams i{animation-duration:.55s!important;animation-delay:0s!important}
  #splash.quick .scan{animation-duration:.45s;animation-delay:.12s}
  #splash.quick .logo{animation:logo .62s cubic-bezier(.2,.8,.2,1) .3s forwards}
  #splash.quick .logo::after{animation:sheen .8s ease-in-out .8s forwards}
  #splash.quick .line{animation-delay:.55s}#splash.quick .t{animation-delay:.62s}#splash.quick .s{animation-delay:.72s}
  /* 차오르는 줄 끝 빛 */
  #splash .b .pg i{box-shadow:0 0 8px rgba(127,179,255,.95)}
  @media(prefers-reduced-motion:reduce){ #splash .ost b,#splash .ost i{animation-duration:.01s!important;animation-delay:0s!important} #splash .amb,#splash .edge,#splash .glint,#splash .shn{display:none} #splash .logo img{animation-duration:.01s!important;animation-delay:0s!important} }

  /* ── 부드럽게 : 폭·흐림·배경색 대신 밀기·늘리기·옅어지기 (앱이 뒤에서 무겁게 불러오는 동안에도 끊기지 않게) ── */
  #splash{background-color:transparent}
  #splash .bgc{position:absolute;inset:0;background:#040915;transition:opacity var(--bt,1s) ease-in-out var(--bd,0s)}
  #splash.out .bgc{opacity:0}
  #splash .scan{width:100vw;transform:translateX(-50%) scaleX(0)}
  @keyframes scan{0%{transform:translateX(-50%) scaleX(0);opacity:1}70%{transform:translateX(-50%) scaleX(.92);opacity:1}100%{transform:translateX(-50%) scaleX(1);opacity:0}}
  #splash .line{width:170px;transform:scaleX(0)}
  @keyframes line{to{transform:none}}
  #splash .b .pg i{width:100%;transform:scaleX(0);transform-origin:0 50%}
  @keyframes pg{to{transform:none}}
  /* 로고 : 창이 왼쪽에서 밀려 들어오고 안의 로고는 제자리 = 왼쪽부터 드러남 (흐림 대신 옅어짐) */
  #splash .logo{overflow:hidden}
  @keyframes logo{0%{opacity:0;transform:translateX(-101%)}45%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes rvi{0%{transform:translateX(101%)}100%{transform:none}}
  #splash .logo img{animation:rvi 1.1s cubic-bezier(.2,.8,.2,1) .85s both}
  #splash.quick .logo img{animation:rvi .62s cubic-bezier(.2,.8,.2,1) .3s both}
  /* 로고 위를 지나가는 빛 : 로고 모양 창 안에서 빛 띠만 밀려 지나감 */
  #splash .logo::after{display:none}
  #splash .shn{position:absolute;inset:0;pointer-events:none;overflow:hidden;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
  #splash .shn i{position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.95) 50%,transparent);transform:translateX(-120%);animation:shn 1.1s ease-in-out 1.9s forwards}
  #splash.quick .shn i{animation-duration:.8s;animation-delay:.8s}
  @keyframes shn{to{transform:translateX(250%)}}
  /* 4초가 넘을 때만 보이는 불러오기 줄도 밀기로 */
  #splash .bar i{left:0}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

  /* ── 작업자 : 역광 연출 (관리자 금빛 방패와 짝)
     0.75초 로고 뒤에서 빛이 번짐 → 0.85초 로고가 어두운 실루엣 + 테두리 빛으로 떠오름 (화면이 천천히 다가옴)
     1.45초 로고가 하얗게 밝아지고 테두리 빛은 은은하게 남음 → 1.9초 로고 위로 빛이 지나감 */
  #splash .bkl{position:absolute;left:50%;top:var(--cy,44%);width:min(96vw,380px);aspect-ratio:1;margin:calc(min(96vw,380px) / -2) 0 0 calc(min(96vw,380px) / -2);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(190,220,255,.62) 0%,rgba(110,165,255,.34) 22%,rgba(50,105,220,.14) 45%,rgba(4,9,21,0) 68%);opacity:0;transform:scale(.55);animation:bkl 1.3s cubic-bezier(.16,1,.3,1) .75s forwards,bkl2 1.6s ease-in-out 2.2s forwards}
  @keyframes bkl{to{opacity:1;transform:none}}
  @keyframes bkl2{to{opacity:.55}}
  #splash .logo{overflow:visible;animation:wpush 2.8s cubic-bezier(.16,1,.3,1) .8s both}

<script>
(function(){

  var APP = 'https://script.google.com/macros/s/AKfycbxgioTbd5RmjUKZzXljEFD5HaTg-gu353soMZmAjMdoZnApTHG8jl5XtZ_gG5W5tJ4/exec';

  // admin=1 말고 다른 것은 넘기지 않습니다.
  var ADMIN = /(?:^|[?&])admin=1(?:&|$)/.test(location.search);
  if (ADMIN) { APP += '?admin=1'; document.title = '일일 안전확인 현황'; }
  // 이 폰 표시(기기ID). 안쪽 구글 화면의 저장공간은 폰이 앱을 닫을 때 지우기도 해서(아이폰, 삼성폰 모두),

  var DEV = '';

    var ok = function (v) { return /^[A-Za-z0-9]{8,40}$/.test(v || ''); };
    var ck = (document.cookie.match(/(?:^|;\s*)osf_dev=([A-Za-z0-9]+)/) || [])[1];

    if (!ok(DEV)) DEV = ok(ck) ? ck : 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

  try { var LI = s.querySelector('.logo img'); LI.className = 'lgm';
    ['lgs', 'lgg'].forEach(function(k){ var c = LI.cloneNode(false); c.className = k; c.alt = ''; LI.parentNode.insertBefore(c, LI.parentNode.firstChild); }); } catch (e) {}
  try { s.style.setProperty('--logo', 'url("' + s.querySelector('.logo img').src + '")'); } catch (e) {}   // 로고 위 빛 지나가기 창 모양 (페이지 안 로고 그림)
  (function(){
    var QK = typeof QUICK !== 'undefined' && QUICK, RMV = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var sd = 11, rnd = function(){ sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
    // 멀리 있는 작은 빛
    var AM = document.getElementById('amb');
    for (var i = 0; i < 16; i++) { var d = document.createElement('i'), z = (1.1 + rnd() * 1.3).toFixed(1);
      d.style.left = (rnd() * 100).toFixed(1) + '%'; d.style.top = (rnd() * 100).toFixed(1) + '%'; d.style.width = d.style.height = z + 'px';
      d.style.setProperty('--o', (.15 + rnd() * .3).toFixed(2)); d.style.setProperty('--d', (3 + rnd() * 3).toFixed(2) + 's'); d.style.setProperty('--dl', (.4 + rnd() * 2.5).toFixed(2) + 's');
      AM.appendChild(d); }
    // OUR SHINING FUTURE : 첫 글자 O, S, F 먼저, 나머지 글자는 첫 글자 뒤로 풀려 나옴
    var B = s.querySelectorAll('.ost b'), I = s.querySelectorAll('.ost i');
    [].forEach.call(B, function(e, n){ e.style.animationDelay = ((QK ? .5 : 1.5) + n * (QK ? .05 : .12)).toFixed(2) + 's'; if (QK) e.style.animationDuration = '.5s'; });
    [].forEach.call(I, function(e, n){ e.style.animationDelay = ((QK ? .66 : 1.9) + n * (QK ? .05 : .1)).toFixed(2) + 's'; if (QK) e.style.animationDuration = '.45s'; });
    if (RMV) return;
    // 로고 고리 오른쪽 끝에서 한 번 맺히는 가는 빛 (로고 위 빛이 다 지나갈 때)
    setTimeout(function(){ try {
      var L = s.querySelector('.logo'), r = L.getBoundingClientRect(), G = document.createElement('div');
      if (!r.width || !G.animate) return;
      G.className = 'glint'; G.innerHTML = '<i></i>'; G.style.left = (r.left + r.width * .975) + 'px'; G.style.top = (r.top + r.height * .27) + 'px'; s.appendChild(G);
      G.animate([{opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'scale(1)', offset: .3}, {opacity: 0, transform: 'scale(1.12)'}], {duration: 900, easing: 'cubic-bezier(.3,0,.3,1)', fill: 'forwards'});
    } catch (e) {} }, QK ? 1450 : 2700);
    // 로고 위로 빛이 지나갈 때 O, S, F 가 같은 때 차례로 반짝임
    var SH = QK ? [980, 1080, 1180] : [2250, 2450, 2650];
    [].forEach.call(B, function(e, n){ setTimeout(function(){ if (e.animate) e.animate([{transform: 'none'}, {transform: 'scale(1.22)', offset: .35}, {transform: 'none'}], {duration: 650, easing: 'ease-in-out'}); }, SH[n]); });
    // 로고가 드러나는 끝을 따라가는 빛 선 (로고가 드러나는 움직임과 같은 시간, 같은 빠르기)
    try {
      var L = s.querySelector('.logo'), r = L.getBoundingClientRect(), E = document.createElement('i');
      if (!r.width || !E.animate) return;
      E.className = 'edge'; E.style.left = r.left + 'px'; E.style.top = (r.top - r.height * .08) + 'px'; E.style.height = (r.height * 1.16) + 'px'; s.appendChild(E);
      E.animate([{transform: 'translateX(0)'}, {transform: 'translateX(' + r.width.toFixed(1) + 'px)'}], {duration: QK ? 620 : 1100, delay: QK ? 300 : 850, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards'});
      E.animate([{opacity: 0}, {opacity: .95, offset: .08}, {opacity: .8, offset: .6}, {opacity: 0}], {duration: QK ? 620 : 1100, delay: QK ? 300 : 850, easing: 'linear', fill: 'forwards'});
    } catch (e) {}
  })();
  document.getElementById('direct').href = APP;
  function hide(){
    if (done) return; done = true; clearTimeout(slow);
    // 화면이 먼저 준비돼도 로고 연출은 끝까지 보여 줍니다
    setTimeout(land, Math.max(0, SHOW - (Date.now() - t0)));
  }
  // 끝 : 로고는 제자리에서 아주 천천히 옅어지고, 그 뒤를 따라 바탕이 걷히며 안전확인 화면이 나옵니다
  function land(){
    var L = s.querySelector('.logo'), T = QUICK ? 1100 : 2200;
    [].forEach.call(s.querySelectorAll('.glow,.grid,.ost,.line,.t,.s,.b,.bar,.logo,.logo img,.amb,.bkl'), function(e){
      var c = getComputedStyle(e), o = c.opacity, tf = c.transform; e.style.animation = 'none'; e.style.opacity = o; if (tf && tf !== 'none') e.style.transform = tf; });
    void s.offsetWidth;                      // 지금 모습에서 이어서 움직이도록
    // 글자와 줄은 먼저 조용히 빠지고, 뒤의 푸른 빛은 로고와 함께 천천히 꺼집니다
    [].forEach.call(s.querySelectorAll('.grid,.ost,.line,.t,.s,.b,.bar,.amb,.bkl'), function(e){
      e.style.transition = 'opacity .9s ease'; e.style.opacity = 0; });
    var G = s.querySelector('.glow'); G.style.transition = 'opacity ' + T + 'ms ease-in-out'; G.style.opacity = 0;
    L.style.transform = 'scale(1.04)'; L.style.opacity = 0;
    if (L.animate) {
      L.animate([{transform: 'none'}, {transform: 'scale(1.04)'}], {duration: T, easing: 'cubic-bezier(.3,0,.3,1)'});
      // 눈은 옅은 빛의 변화에 예민해서, 진하기를 똑같은 빠르기로 빼면 끝에 「팍」 꺼져 보입니다.
      // 진하기를 (1-t)^2.6 으로 빼서 눈에 고르게 줄어들고, 끝으로 갈수록 더 천천히 사라지게 합니다.
      var K = [];
      for (var i = 0; i <= 20; i++) K.push({opacity: Math.pow(1 - i / 20, 2.6), offset: i / 20});
      L.animate(K, {duration: T, easing: 'linear'});
    } else {
      L.style.transition = 'transform ' + T + 'ms ease,opacity ' + T + 'ms linear';
    }
    // 바탕은 로고가 절반쯤 옅어진 뒤부터 천천히 걷힙니다
    s.style.setProperty('--bt', Math.round(T * .65) + 'ms'); s.style.setProperty('--bd', Math.round(T * .35) + 'ms');   // 바탕 층을 옅게
    s.className = QUICK ? 'quick out' : 'out';   // quick 을 지우면 숨겨 둔 빛줄기가 끝날 때 나타나 움직이던 것 막음
    document.getElementById('tc').content = '#0c1a3d';   // 위쪽 상태바를 앱 머리 색으로
    setTimeout(function(){ s.style.display = 'none'; }, T + 150);
  }
  function go(){
    done = false; s.className = QUICK ? 'quick' : ''; s.style.display = '';
    document.getElementById('fail').style.display = 'none'; document.getElementById('bar').style.display = '';
    f.onload = hide; f.src = APP + (APP.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
    clearTimeout(slow);
    slow = setTimeout(function(){              // 15초가 넘으면 다시 시도 버튼
      if (done) return;
      document.getElementById('bar').style.display = 'none';
      document.getElementById('fail').style.display = 'block';
    }, 15000);
  }
  document.getElementById('retry').onclick = function(){ t0 = Date.now() - SHOW; go(); };
  go();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
