<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 보안 : 이 페이지는 우리 파일만 씁니다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>안전확인 앱 설치 방법</title>
<meta name="theme-color" content="#0c1a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="안전확인">
<style>
  :root{--navy:#0c1a3d;--blue:#1a73e8;--red:#e5262b;--bg:#f4f6fa;--text:#111}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);word-break:keep-all;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
  header{background:linear-gradient(135deg,#0c1a3d,#1b3470);color:#fff;padding:22px 16px 20px;text-align:center}
  header img{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
  header p{margin:6px 0 0;font-size:15px;font-weight:600;opacity:.92}
  .go{display:block;margin:18px 0 0;padding:16px;border-radius:16px;background:var(--red);color:#fff;text-align:center;
    text-decoration:none;font-size:19px;font-weight:900;box-shadow:0 6px 18px rgba(229,38,43,.3)}
  .go small{display:block;margin-top:4px;font-size:12.5px;font-weight:600;opacity:.95;white-space:nowrap}
  .tabs{display:flex;margin:18px 0 12px;background:#e3e8f0;border-radius:14px;padding:4px}
  .tabs button{flex:1;border:0;background:none;padding:12px 6px;border-radius:11px;font:inherit;font-size:17px;font-weight:800;color:#4b5568;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(20,30,60,.12)}
  .tabs button[data-os="and"].on{color:var(--blue)}
  .warn{display:none;margin:0 0 12px;padding:14px 16px;border:3px solid var(--red);border-radius:16px;background:#fff7f7;
    font-size:16px;font-weight:700;line-height:1.6}
  .warn b{color:var(--red)}
  .warn.on{display:block}
  .pages img{display:block;width:100%;height:auto;margin:0 0 12px;border-radius:14px;box-shadow:0 4px 16px rgba(20,30,60,.1);background:#fff}
  .pages[hidden]{display:none}
  .tip{margin-top:6px;padding:14px 16px;background:#fff;border:2px solid #dde3ee;border-radius:16px;font-size:15px;font-weight:600;line-height:1.7;color:#3b4456}
  .tip b{color:var(--text)}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>안전확인 앱 설치 방법</h1>
  <p>한 번 설치하면 다음부터 아이콘으로</p>
</header>
<div class="wrap">
  <a class="go" href="https://sung5790-hue.github.io/osf-safety/">설치 링크 열기
    <small>https://sung5790-hue.github.io/osf-safety/</small></a>

  <div class="tabs" role="tablist">
    <button type="button" data-os="and" role="tab">안드로이드</button>
    <button type="button" data-os="ios" role="tab">아이폰</button>
  </div>

  <div class="warn" id="warn">⚠ <b>크롬</b>으로 열렸는지 <b>삼성 인터넷</b>으로 열렸는지 꼭 확인<br>
    크롬은 <b>위 오른쪽 ⋮</b>, 삼성 인터넷은 <b>아래 오른쪽 ≡</b></div>

  <div class="pages" id="p-and">
    <img src="g_and_1.webp" width="1080" height="1920" alt="안드로이드 1">
    <img src="g_and_2.webp" width="1080" height="1920" alt="안드로이드 2" loading="lazy">
    <img src="g_and_3.webp" width="1080" height="1920" alt="안드로이드 3" loading="lazy">
    <img src="g_and_4.webp" width="1080" height="1920" alt="안드로이드 4" loading="lazy">
    <img src="g_and_5.webp" width="1080" height="1920" alt="안드로이드 5" loading="lazy">
  </div>
  <div class="pages" id="p-ios" hidden>
    <img src="g_ios_1.webp" width="1080" height="1920" alt="아이폰 1">
    <img src="g_ios_2.webp" width="1080" height="1920" alt="아이폰 2" loading="lazy">
    <img src="g_ios_3.webp" width="1080" height="1920" alt="아이폰 3" loading="lazy">
    <img src="g_ios_4.webp" width="1080" height="1920" alt="아이폰 4" loading="lazy">
  </div>

  <div class="tip">설치가 안 되면 <b>각 PJT 리더</b>에게 말씀해 주세요.<br>
    설치를 못 했어도 위 <b>설치 링크</b>를 누르면 오늘 안전확인은 바로 할 수 있습니다.</div>
</div>
<script>
(function(){
  // 이 페이지를 홈 화면에 잘못 추가했으면 안전확인으로 바로 보냅니다
  if ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) {
    location.replace('./'); return;
  }
  var tabs = document.querySelectorAll('.tabs button');
  function show(os){
    [].forEach.call(tabs, function(b){ var on = b.getAttribute('data-os') === os; b.className = on ? 'on' : ''; b.setAttribute('aria-selected', on); });
    document.getElementById('p-and').hidden = os !== 'and';
    document.getElementById('p-ios').hidden = os !== 'ios';
    document.getElementById('warn').className = os === 'and' ? 'warn on' : 'warn';
  }
  [].forEach.call(tabs, function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-os')); }); });
  // 폰 종류를 보고 처음 화면을 고릅니다
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  show(ios ? 'ios' : 'and');
})();
</script>
</body>
</html>
